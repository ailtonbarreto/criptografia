<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <title>Simulador Enigma - QWERTY (Rotores Fixos)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>Máquina Enigma Simulada</h1>

    <div class="controls">


        <div class="row-controls">
            <select id="plugboard" required>
                <option value="">Selecione o plugboard...</option>
                <option value="AB CD EF">AB CD EF</option>
                <option value="PQ RS TU">PQ RS TU</option>
                <option value="JK LM NO">JK LM NO</option>
                <option value="XZ YW VU">XZ YW VU</option>
            </select>
        </div>

        <div class="rotor-config" aria-label="Posições iniciais dos rotores (A=0 ... Z=25)">
            <!-- Rotores fixos: I, II, III -->
            <label style="opacity:0.9">Rotor I</label>
            <input id="rotor1_pos" type="number" min="0" max="25" value="0" title="Posição rotor 1 (0-25)" />

            <label style="opacity:0.9">Rotor II</label>
            <input id="rotor2_pos" type="number" min="0" max="25" value="0" title="Posição rotor 2 (0-25)" />

            <label style="opacity:0.9">Rotor III</label>
            <input id="rotor3_pos" type="number" min="0" max="25" value="0" title="Posição rotor 3 (0-25)" />
        </div>

        <textarea id="output" placeholder="Resultado" readonly></textarea>

        <div class="buttons">
            <button id="translate_btn">Descriptografar</button>
            <button id="copy_btn">Copiar</button>
            <button id="clear_btn">Limpar</button>
        </div>
    </div>

    <div class="panels">

        <div class="lamps-wrap">
            <div class="lampboard" id="lamps"></div>
        </div>

        <div class="keyboard-wrap">
            <div class="keyboard" id="keyboard"></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
