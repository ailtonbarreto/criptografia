    <div class="controls">


        <div class="row-controls">
            <select id="plugboard" required>
                <option value="">Selecione uma configuração</option>
                <option value="AB CD EF">AMOR</option>
                <option value="PQ RS TU">ÓDIO</option>
                <option value="JK LM NO">CASAMENTO</option>
                <option value="XZ YW VU">CARRO</option>
            </select>
        </div>

        <textarea id="output" placeholder="Resultado" readonly></textarea>


    </div>

    <div class="panels">

        <div class="lamps-wrap">
            <div class="lampboard" id="lamps"></div>
        </div>

        <div class="keyboard-wrap">
            <div class="keyboard" id="keyboard"></div>
